<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd778">
  <meta name="description" content="Makmal geometri interaktif untuk murid Matematik Tahun 2 SK dan SJKC.">
  <title>Smart Geometry Lab - Math Year 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">📐</div>
        <div>
          <h1 data-i18n="title">Jom Teroka Geometri!</h1>
          <p data-i18n="subtitle">Alat manipulatif berpandukan buku teks SK &amp; SJKC Tahun 2–6.</p>
        </div>
      </div>

      <div class="top-actions">
        <button id="soundToggle" class="sound-button" type="button" aria-pressed="true">
          <span aria-hidden="true">🔊</span>
          <span data-i18n="soundOn">Bunyi: Buka</span>
        </button>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ms" class="active">BM</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="Aktiviti utama">
      <button type="button" data-mode="shape" class="active"><span>🔷</span><span data-i18n="tabShape">Bentuk &amp; Simetri</span></button>
      <button type="button" data-mode="line"><span>📐</span><span data-i18n="tabLine">Sudut &amp; Garisan</span></button>
      <button type="button" data-mode="measure"><span>📏</span><span data-i18n="tabMeasure">Ukur &amp; Bina</span></button>
    </nav>

    <main class="workspace">
      <aside class="control-card">
        <div class="eyebrow" data-i18n="chooseActivity">Pilih alat</div>
        <h2 id="sideTitle">Bentuk &amp; Simetri</h2>
        <div class="divider"></div>

        <label for="gradeSelect" data-i18n="grade">Tahun</label>
        <select id="gradeSelect">
          <option value="2">Tahun 2</option>
          <option value="3">Tahun 3</option>
          <option value="4">Tahun 4</option>
          <option value="5">Tahun 5</option>
          <option value="6">Tahun 6</option>
        </select>

        <label for="activitySelect" data-i18n="activity">Alat</label>
        <select id="activitySelect"></select>

        <div id="scopeNote" class="scope-note"></div>
        <div id="tipBox" class="tip-box"><span aria-hidden="true">☝️</span><span></span></div>

        <div class="side-spacer"></div>
        <button id="teacherButton" class="teacher-button" type="button">👩‍🏫 <span data-i18n="teacherMode">Tetapan guru</span></button>
        <button id="resetToolButton" class="secondary-button" type="button">↻ <span data-i18n="resetTool">Tetapkan semula alat</span></button>
      </aside>

      <section class="activity-card" aria-live="polite">
        <div class="activity-heading">
          <div>
            <div class="eyebrow" data-i18n="tryIt">Mari cuba!</div>
            <h2 id="activityTitle"></h2>
          </div>
          <div class="heading-actions"><span id="gradeBadge" class="grade-badge">T2</span></div>
        </div>

        <div id="challengePanel" class="challenge-panel"></div>
        <div id="toolGuide" class="tool-guide"></div>
        <div id="visualStage" class="visual-stage"></div>
        <div id="controlArea" class="control-area"></div>
        <div id="liveSummary" class="feedback neutral" role="status"></div>
      </section>
    </main>

    <div class="steps" aria-label="Langkah aktiviti">
      <div><b>1</b><span data-i18n="stepObserve">Perhatikan bentuk</span></div>
      <div><b>2</b><span data-i18n="stepTry">Gerakkan &amp; bina</span></div>
      <div><b>3</b><span data-i18n="stepCheck">Ukur perubahan</span></div>
    </div>
  </div>

  <footer class="forest-footer" aria-hidden="true"><img src="assets/forest-footer.png" alt=""></footer>

  <dialog id="teacherDialog" class="teacher-dialog">
    <form method="dialog" id="teacherForm">
      <button class="dialog-close" value="cancel" aria-label="Close" type="submit">×</button>
      <div class="eyebrow" data-i18n="teacherMode">Tetapan guru</div>
      <h2 data-i18n="customSettings">Tetapkan nilai demonstrasi</h2>
      <div class="divider"></div>
      <p data-i18n="customHelp">Tetapkan ukuran untuk demonstrasi kelas. Medan berubah mengikut alat.</p>
      <div id="teacherFields" class="teacher-fields"></div>
      <p id="teacherError" class="dialog-error"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="secondary-button" data-i18n="cancel">Batal</button>
        <button type="button" id="useTeacherSettings" class="primary-button">✓ <span data-i18n="useSettings">Gunakan tetapan</span></button>
      </div>
    </form>
  </dialog>

  <script src="grade-config.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
